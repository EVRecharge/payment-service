spring:
  application:
    name: payment-service
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ev_payment_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

server:
  port: ${SERVER_PORT:8005}

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    instance-id: ${spring.application.name}:${server.port}

# JWT_SECRET must match user-service/provider-service -- this service only validates tokens
# they issue, it never signs its own.
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidationWithMinimum32Characters}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://evrechargeindia.com,https://www.evrechargeindia.com,http://localhost:4200}
  public-base-url: ${PUBLIC_BASE_URL:https://evrechargeindia.com}
  razorpay:
    # Test-mode keys by default -- swap for live keys (via Secrets Manager) only once Razorpay KYC
    # is approved. Never commit real keys; key-secret and webhook-secret are read from env/Secrets
    # Manager only.
    key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
    key-secret: ${RAZORPAY_KEY_SECRET:placeholder_secret}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}
    api-base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com}
    # Percentage (0-100) of each booking's amount that is transferred to the provider's linked
    # Razorpay account at capture time; the remainder is the platform's commission.
    provider-split-percent: ${RAZORPAY_PROVIDER_SPLIT_PERCENT:85}

logging:
  level:
    root: INFO
    com.evcharging: DEBUG
  file:
    name: logs/payment-service.log

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
